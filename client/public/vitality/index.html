  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    }

      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

      ...globalThis.openai,
      openExternal,

    };

          document.body.getBoundingClientRect().height,

    &quot;message&quot;,

        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

#rv-page figcaption {margin-top:12px;font-size:12px;color:var(--rv-muted);text-align:center;}

#rv-page .rv-rhythm-intro {margin-top:14px;color:var(--rv-muted);max-width:630px;font-size:14px;}
#rv-page .rv-gatherings {display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px;}
#rv-page .rv-gathering {background:var(--rv-surface);padding:30px;border-radius:var(--rv-radius);box-shadow:0 6px 22px #153a3c0a;}
#rv-page .rv-format {font-size:12px;margin-top:13px;color:var(--rv-accent);font-weight:500;}
#rv-page .rv-gathering p:last-child {margin-top:18px;font-size:14px;line-height:1.85;}
#rv-page .rv-welcome {margin:0 calc(var(--rv-gutter) + 24px);padding:36px 0;border-top:1px solid var(--rv-line);display:grid;grid-template-columns:1fr 1.55fr;gap:7%;align-items:start;}
#rv-page .rv-welcome p {font-size:14px;}
#rv-page .rv-welcome p+p {margin-top:12px;}
#rv-page .rv-about {padding-top:4px;padding-bottom:42px;display:grid;grid-template-columns:1fr 1.55fr;gap:7%;}
#rv-page .rv-about p {font-size:14px;}
#rv-page .rv-credentials {display:block;font:400 12px/1.6 Montserrat,sans-serif;letter-spacing:.04em;margin-top:12px;color:var(--rv-muted);}
#rv-page .rv-signup {margin:0 24px;background:var(--rv-dark);color:var(--rv-on-dark);border-radius:var(--rv-radius);display:grid;grid-template-columns:1fr 1.1fr;gap:7%;padding:36px var(--rv-gutter);align-items:center;}
#rv-page .rv-signup p {margin-top:16px;font-size:14px;}
#rv-page form {margin:0;min-width:0;}
#rv-page label {display:block;font-size:13px;margin-bottom:9px;}
#rv-page input {width:100%;min-height:50px;padding:12px 14px;font:400 16px/1.5 Montserrat,sans-serif;border:1px solid #a8bfbd;border-radius:8px;background:#f5f2ed;color:#163537;caret-color:#873981;}
#rv-page input::placeholder {color:#5a6565;}
#rv-page .rv-signup input:focus-visible,#rv-page .rv-signup button:focus-visible {outline-color:#e7bce5;}
#rv-page .rv-signup button {margin-top:12px;background:#d8b1d8;color:#302433;width:100%;}
#rv-page .rv-signup button:hover {background:#e6c5e6;}
#rv-page .rv-signup .rv-demo {font-size:12px;line-height:1.6;color:#c4d4d2;margin-top:12px;}
#rv-page .rv-response:empty {display:none;}
#rv-page .rv-response {padding-top:5px;color:var(--rv-on-dark);}
#rv-page footer {padding:22px calc(var(--rv-gutter) + 24px);display:flex;justify-content:space-between;gap:20px;font-size:12px;color:var(--rv-muted);}
#rv-page[data-density=&quot;compact&quot;] .rv-section {padding-top:28px;padding-bottom:28px;}
#rv-page[data-density=&quot;compact&quot;] .rv-about {padding-top:4px;}
@container (max-width:700px) {
  #rv-page .rv-nav {padding:15px 24px;}
  #rv-page .rv-navlinks a:not(:last-child) {display:none;}
  #rv-page .rv-navlinks a:last-child {border:0;padding:0;}
  #rv-page .rv-name {font-size:23px;}
  #rv-page .rv-hero {grid-template-columns:1fr;padding:32px 26px;gap:28px;}
  #rv-page h1 {font-size:68px;max-width:400px;}
  #rv-page .rv-hero figure {width:100%;max-width:300px;justify-self:center;}
  #rv-page .rv-section {padding:34px 24px;}
  #rv-page .rv-gatherings {gap:16px;}
  #rv-page .rv-gathering {padding:24px;}
  #rv-page .rv-welcome {margin:0 24px;padding:30px 0;}
  #rv-page .rv-welcome,#rv-page .rv-about,#rv-page .rv-signup {grid-template-columns:1fr;gap:18px;}
  #rv-page .rv-about {padding-top:0;}
  #rv-page .rv-signup {padding:28px 24px;gap:25px;}
  #rv-page footer {padding:20px 24px;flex-wrap:wrap;gap:5px;}
}
@container (max-width:480px) {
  #rv-page .rv-hero,#rv-page .rv-signup {margin-right:14px;margin-left:14px;}
  #rv-page .rv-hero {padding:28px 22px;}
  #rv-page .rv-nav {padding-right:20px;padding-left:20px;gap:12px;}
  #rv-page .rv-navlinks {font-size:12px;}
  #rv-page .rv-gatherings {grid-template-columns:1fr;}
  #rv-page h1 {font-size:60px;}
}

        &lt;p class=&quot;rv-with&quot;&gt;A community of practice taking shape with Nancy Turnquist.&lt;/p&gt;

    } else if (event.key === &quot;End&quot;) {

        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
